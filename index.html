<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Presse HGGSP</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIyIiBmaWxsPSIjMGQwZjE2Ii8+PHRleHQgeD0iNTAiIHk9IjY4IiBmb250LXNpemU9IjU4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7wn5OcPC90ZXh0Pjwvc3ZnPg==">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg-1:#07080c;
  --bg-2:#0d0f16;
  --glass:rgba(255,255,255,.035);
  --glass-brd:rgba(255,255,255,.09);
  --ink:#eef0f5;
  --ink-dim:#8b90a3;
  --blue:#3aa0ff;
  --purple:#a15aef;
  --pink:#ff5c82;
  --green:#37d67a;
  --orange:#ffab3d;
  --yellow:#ffd93d;
  --radius:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);
}
#appShell{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:
    linear-gradient(180deg, rgba(6,7,10,.88), rgba(11,13,19,.93)),
    radial-gradient(circle at 20% 0%, rgba(58,160,255,.10), transparent 40%),
    radial-gradient(circle at 85% 10%, rgba(161,90,239,.08), transparent 45%),
    url('https://res.cloudinary.com/dmvoedoe6/image/upload/v1789122895/mg-7be6fc52-w828-w1161_tj9evd.webp') center/cover no-repeat;
}
#scrollArea{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
h1,h2,h3,.brand,.tabbar button{font-family:'Manrope',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);}

/* ---------- HEADER ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  background:rgba(12,14,26,.55);
  border-bottom:1px solid var(--glass-brd);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;}
.brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 14px rgba(191,90,242,.8);}
.status-pill{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- BOTTOM TAB BAR ---------- */
.tabbar{
  position:relative;flex:none;
  margin:0 auto calc(12px + env(safe-area-inset-bottom));margin-top:10px;
  display:flex;gap:4px;padding:6px;width:fit-content;
  background:rgba(10,11,16,.72);
  border:1px solid var(--glass-brd);
  border-radius:999px;
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 12px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}
.tabbar button{
  border:none;background:transparent;color:var(--ink-dim);
  padding:11px 24px;border-radius:999px;font-size:14.5px;font-weight:700;
  cursor:pointer;transition:color .3s ease;position:relative;z-index:1;
  letter-spacing:.01em;
}
.tabbar button.active{color:#fff;}
.tab-pill{
  position:absolute;top:5px;bottom:5px;left:5px;
  border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--purple) 130%);
  box-shadow:0 4px 16px rgba(58,160,255,.28);
  transition:transform .35s cubic-bezier(.4,0,.2,1), width .35s cubic-bezier(.4,0,.2,1);
  z-index:0;
}

/* ---------- LAYOUT ---------- */
.page{display:none;max-width:1300px;margin:0 auto;padding:26px 22px 30px;animation:fadein .4s ease;}
.page.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.glass{
  background:var(--glass);
  border:1px solid var(--glass-brd);
  border-radius:var(--radius);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
/* bordures fines colorées, respiration très légère */
@keyframes edgeGlow{
  0%,100%{ box-shadow: 0 0 0 1px var(--edge-c, transparent) inset, 0 8px 30px -18px var(--edge-c, transparent); }
  50%{ box-shadow: 0 0 0 1px var(--edge-c, transparent) inset, 0 10px 34px -14px var(--edge-c, transparent); }
}
.edge-blue{ --edge-c: rgba(58,160,255,.35); animation: edgeGlow 6s ease-in-out infinite; }
.edge-purple{ --edge-c: rgba(161,90,239,.32); animation: edgeGlow 6s ease-in-out infinite; }
.edge-pink{ --edge-c: rgba(255,92,130,.32); animation: edgeGlow 6s ease-in-out infinite; }
.edge-green{ --edge-c: rgba(55,214,122,.32); animation: edgeGlow 6s ease-in-out infinite; }
.edge-orange{ --edge-c: rgba(255,171,61,.32); animation: edgeGlow 6s ease-in-out infinite; }

/* ===================== PROJET (bloc-notes) ===================== */
.projet-layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start;}
@media (max-width:820px){.projet-layout{grid-template-columns:1fr;}}
.notes-sidebar{padding:16px;position:sticky;top:88px;}
.notes-sidebar h3{margin:2px 4px 12px;font-size:13px;letter-spacing:.02em;color:var(--ink-dim);font-weight:700;text-transform:none;}
.note-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:14px;margin-bottom:6px;cursor:pointer;
  border:1px solid transparent;
  transition:background .2s, transform .15s;
  font-size:14.5px;font-weight:600;
}
.note-item:hover{background:rgba(255,255,255,.06);}
.note-item.active{background:rgba(255,255,255,.1);border-color:var(--glass-brd);}
.note-color{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor;}
.note-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-del{opacity:0;font-size:13px;color:var(--ink-dim);transition:opacity .2s;}
.note-item:hover .note-del{opacity:1;}
.note-del:hover{color:var(--pink);}
.note-move{display:flex;flex-direction:column;opacity:0;transition:opacity .2s;line-height:.7;margin-right:2px;}
.note-item:hover .note-move{opacity:1;}
.note-move .mv{font-size:11px;color:var(--ink-dim);cursor:pointer;padding:1px 2px;}
.note-move .mv:hover{color:#fff;}
.note-move .mv.disabled{opacity:.25;pointer-events:none;}
.add-note-btn{
  width:100%;margin-top:8px;padding:11px;border-radius:14px;border:1.5px dashed var(--glass-brd);
  background:transparent;color:var(--ink-dim);font-weight:700;cursor:pointer;font-size:13.5px;
  transition:.2s;
}
.add-note-btn:hover{border-color:var(--blue);color:#fff;background:rgba(10,132,255,.1);}

.editor-card{padding:0;overflow:hidden;min-height:640px;display:flex;flex-direction:column;}
.editor-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 20px;border-bottom:1px solid var(--glass-brd);
}
.editor-title{
  border:none;background:transparent;color:#fff;font-family:'Manrope',sans-serif;
  font-weight:800;font-size:20px;width:100%;outline:none;
}
.editor-title::placeholder{color:var(--ink-dim);}
.pen-btn{
  flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:.2s;
}
.pen-btn:hover{background:linear-gradient(135deg,var(--blue),var(--purple));transform:rotate(-8deg) scale(1.05);}
.pen-btn.active{background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 0 3px rgba(58,160,255,.25);}
.style-menu{
  padding:0 20px;border-bottom:1px solid var(--glass-brd);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .3s ease, padding .3s ease, opacity .2s ease;
}
.style-menu.open{max-height:220px;padding:14px 20px;opacity:1;}
.style-menu select{
  border:1px solid var(--glass-brd);background:rgba(255,255,255,.08);color:#fff;
  border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;cursor:pointer;
  -webkit-appearance:none;appearance:none;min-width:98px;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
  background-position:calc(100% - 14px) calc(50% - 2px), calc(100% - 9px) calc(50% - 2px);
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
}
.style-menu input[type=color]{
  -webkit-appearance:none;appearance:none;
  width:34px;height:34px;border-radius:9px;border:1px solid var(--glass-brd);
  padding:0;background:rgba(255,255,255,.08);cursor:pointer;flex:none;
}
.style-menu input[type=color]::-webkit-color-swatch-wrapper{padding:3px;}
.style-menu input[type=color]::-webkit-color-swatch{border:none;border-radius:6px;}
.style-menu input[type=color]::-moz-color-swatch{border:none;border-radius:6px;}
.menu-sep{width:1px;align-self:stretch;background:var(--glass-brd);flex:none;margin:2px 2px;}
.fmt-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.08);color:#fff;font-size:14px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;
}
.fmt-btn:hover{background:rgba(255,255,255,.18);}
.fmt-btn.active{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:transparent;}
.editor-body{flex:1;padding:22px 26px;outline:none;font-size:15.5px;line-height:1.75;overflow-y:auto;}
.editor-body:empty:before{content:attr(data-placeholder);color:var(--ink-dim);}
.editor-body.read-only{cursor:default;}
.editor-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 20px;border-top:1px solid var(--glass-brd);font-size:12px;color:var(--ink-dim);
}
.attach-btn{
  border:1px solid var(--glass-brd);background:rgba(255,255,255,.08);color:var(--ink-dim);
  padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;
}
.attach-btn:hover{color:#fff;background:rgba(255,255,255,.16);}
.attachments{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px;}
.attach-chip{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
  border:1px solid var(--glass-brd);padding:7px 10px;border-radius:12px;font-size:12.5px;max-width:220px;
}
.attach-chip img{width:24px;height:24px;object-fit:cover;border-radius:5px;}
.attach-chip a{color:var(--blue);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-chip .rm{cursor:pointer;color:var(--ink-dim);}
.attach-chip .rm:hover{color:var(--pink);}
.save-indicator{display:flex;align-items:center;gap:6px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.save-dot.saving{background:var(--orange);animation:pulse 1s infinite;}

/* Color picker for tab / swatches */
.swatches{display:flex;gap:6px;}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;}
.swatch.sel{border-color:#fff;transform:scale(1.15);}

/* ===================== COMMUNICATION (forum) ===================== */
.forum-wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:440px;overflow:hidden;}
.forum-header{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--glass-brd);flex:none;}
.forum-feed{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.forum-composer{padding:14px 18px;flex:none;border-top:1px solid var(--glass-brd);}
.composer-row{display:flex;gap:10px;align-items:flex-end;}
.composer-row input[type=text]{
  flex:none;width:170px;border:1px solid var(--glass-brd);background:rgba(255,255,255,.07);
  color:#fff;border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;
}
.composer-row textarea{
  flex:1;resize:none;border:1px solid var(--glass-brd);background:rgba(255,255,255,.07);
  color:#fff;border-radius:12px;padding:11px 13px;font-size:14.5px;font-family:inherit;outline:none;min-height:44px;max-height:140px;
}
.composer-row input:focus,.composer-row textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.25);}
.send-btn{
  flex:none;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s, box-shadow .15s;
  box-shadow:0 6px 18px rgba(10,132,255,.4);
}
.send-btn:hover{transform:scale(1.07);}
.send-btn:active{transform:scale(.94);}
.reply-banner{
  display:none;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(191,90,242,.14);border:1px solid rgba(191,90,242,.35);
  padding:8px 12px;border-radius:10px;font-size:12.5px;margin-bottom:10px;
}
.reply-banner.show{display:flex;}
.reply-banner .cancel{cursor:pointer;color:var(--ink-dim);font-weight:700;}

.msg{
  padding:16px 18px;margin-bottom:14px;border-radius:18px;
  animation:pop .35s cubic-bezier(.2,.9,.3,1.3);
  position:relative;
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.msg-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;
}
.msg-name{font-weight:700;font-size:14.5px;}
.msg-time{font-size:11.5px;color:var(--ink-dim);margin-left:auto;}
.msg-text{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.msg-actions{display:flex;gap:14px;margin-top:9px;}
.msg-actions span{font-size:12px;color:var(--ink-dim);cursor:pointer;font-weight:700;transition:.15s;}
.msg-actions span:hover{color:#fff;}
.msg-edited{font-size:11px;color:var(--ink-dim);font-style:italic;margin-left:6px;}
.thread-reply{
  margin:12px 0 0 26px;padding:12px 14px;border-radius:14px;
  border-left:3px solid var(--purple);background:rgba(255,255,255,.05);
}
.edit-area{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--glass-brd);border-radius:10px;color:#fff;padding:8px;font-family:inherit;font-size:14px;}
.edit-actions{display:flex;gap:8px;margin-top:8px;}
.edit-actions button{border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
.edit-save{background:var(--green);color:#04250f;}
.edit-cancel{background:rgba(255,255,255,.12);color:#fff;}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-dim);}

/* ===================== ASSISTANT (IA) ===================== */
.chat-wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:420px;}
.chat-header{padding:18px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--glass-brd);}
.ai-avatar{
  width:44px;height:44px;border-radius:50%;
  background:conic-gradient(from 180deg, var(--blue), var(--purple), var(--pink), var(--blue));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  animation:spin 6s linear infinite;
}
.ai-avatar span{animation:spin 6s linear infinite reverse;display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.chat-messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
.bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;animation:pop .3s ease;}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,var(--blue),#4aa8ff);color:#fff;border-bottom-right-radius:4px;}
.bubble.ai{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid var(--glass-brd);border-bottom-left-radius:4px;}
.typing{display:flex;gap:4px;align-self:flex-start;padding:14px 16px;}
.typing span{width:7px;height:7px;background:var(--ink-dim);border-radius:50%;animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-6px);opacity:1;}}
.chat-input-bar{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--glass-brd);}
.chat-input-bar textarea{
  flex:1;resize:none;border:1px solid var(--glass-brd);background:rgba(255,255,255,.07);
  color:#fff;border-radius:16px;padding:12px 16px;font-size:14.5px;font-family:inherit;outline:none;max-height:120px;
}
.chat-input-bar textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(191,90,242,.25);}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,30,.9);border:1px solid var(--glass-brd);color:#fff;padding:11px 18px;
  border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:200;backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .topbar{padding:12px 14px;}
  .status-pill{display:none;}
  .composer-row{flex-wrap:wrap;}
  .composer-row input[type=text]{width:100%;}
  .tabbar{width:calc(100% - 24px);justify-content:space-between;margin-bottom:calc(10px + env(safe-area-inset-bottom));}
  .tabbar button{padding:11px 10px;font-size:13px;flex:1;text-align:center;}
  .page{padding:18px 14px 24px;}
  .note-del,.note-move{opacity:1;}
  .editor-head{padding:14px 16px;}
  .editor-title{font-size:17px;}
  .style-menu{gap:6px;}
  .style-menu.open{padding:12px 14px;}
  .fmt-btn{width:32px;height:32px;font-size:13px;}
  .editor-body{padding:16px 18px;font-size:15px;}
  .chat-wrap,.forum-wrap{height:calc(100vh - 190px);}
  .notes-sidebar{position:static;}
}
</style>
</head>
<body>

<div id="appShell">
<div class="topbar">
  <div class="brand"><span class="dot"></span>Presse HGGSP</div>
  <div class="status-pill"><span class="status-dot"></span><span id="statusText">Connecté</span></div>
</div>

<div id="scrollArea">

<!-- ================= PROJET ================= -->
<div class="page active" id="page-projet">
  <div class="projet-layout">
    <div class="glass notes-sidebar edge-blue">
      <h3>Mes onglets</h3>
      <div id="noteList"></div>
      <button class="add-note-btn" id="addNoteBtn">+ Nouvel onglet</button>
    </div>

    <div class="glass editor-card edge-purple">
      <div class="editor-head">
        <input type="text" class="editor-title" id="noteTitle" placeholder="Titre de la note…">
        <button class="pen-btn" id="penBtn" title="Personnaliser">🖊️</button>
      </div>
      <div class="style-menu" id="styleMenu">
        <select id="fontFamily" title="Police">
          <option value="Inter">Inter</option>
          <option value="Manrope">Manrope</option>
          <option value="Georgia">Georgia</option>
          <option value="'Courier New'">Courier</option>
          <option value="'Comic Sans MS'">Comic Sans</option>
          <option value="'Times New Roman'">Times</option>
        </select>
        <select id="fontSize" title="Taille">
          <option value="1">Petit</option>
          <option value="3" selected>Normal</option>
          <option value="5">Grand</option>
          <option value="7">Très grand</option>
        </select>
        <input type="color" id="fontColor" title="Couleur du texte" value="#f2f3f7">
        <input type="color" id="bgColor" title="Surlignage" value="#ffd60a">
        <button class="fmt-btn" data-cmd="bold" title="Gras"><b>G</b></button>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyC4F723OeL9TtKlOJy79F8MP03IbsAfAV8",
  authDomain: "daily-dc31a.firebaseapp.com",
  databaseURL: "https://daily-dc31a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "daily-dc31a",
  storageBucket: "daily-dc31a.firebasestorage.app",
  messagingSenderId: "182039297371",
  appId: "1:182039297371:web:90d2f491c1951328d52e7e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const AI_ENDPOINT = "https://daily.otu-claudeai.workers.dev/";

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= TABS ================= */
const tabBtns = document.querySelectorAll('.tabbar button');
const pill = document.getElementById('tabPill');
function movePill(btn){
  pill.style.width = btn.offsetWidth + 'px';
  pill.style.transform = `translateX(${btn.offsetLeft - 5}px)`;
}
tabBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tabBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    movePill(btn);
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+btn.dataset.tab).classList.add('active');
  });
});
window.addEventListener('load', ()=>movePill(document.querySelector('.tabbar button.active')));
window.addEventListener('resize', ()=>movePill(document.querySelector('.tabbar button.active')));

/* ================================================================
   PROJET — BLOC-NOTES
   ================================================================ */
const TAB_COLORS = ['#0a84ff','#bf5af2','#ff375f','#30d158','#ff9f0a','#ffd60a','#64d2ff','#ff6482'];
let notes = {};        // id -> {name, color, title, html, attachments:[]}
let currentNoteId = null;
let saveTimer = null;
const notesCol = db.collection('projet_notes');

function uid(){ return 'n' + Date.now() + Math.random().toString(36).slice(2,7); }

function renderSwatches(selected){
  const box = document.getElementById('tabSwatches');
  box.innerHTML = '';
  TAB_COLORS.forEach(c=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (c===selected?' sel':'');
    s.style.background = c;
    s.onclick = ()=>{
      if(!currentNoteId) return;
      notes[currentNoteId].color = c;
      renderSwatches(c);
      renderNoteList();
      scheduleSave();
    };
    box.appendChild(s);
  });
}

function renderNoteList(){
  const list = document.getElementById('noteList');
  list.innerHTML = '';
  const ids = Object.keys(notes).sort((a,b)=> (notes[a].order||0) - (notes[b].order||0));
  ids.forEach((id,idx)=>{
    const n = notes[id];
    const item = document.createElement('div');
    item.className = 'note-item' + (id===currentNoteId ? ' active' : '');
    item.innerHTML = `<span class="note-color" style="color:${n.color};background:${n.color}"></span>
      <span class="note-name">${n.title || 'Sans titre'}</span>
      <span class="note-move">
        <span class="mv up" title="Monter">︿</span>
        <span class="mv down" title="Descendre">﹀</span>
      </span>
      <span class="note-del" title="Supprimer">✕</span>`;
    item.querySelector('.note-name').onclick = ()=>selectNote(id);
    item.querySelector('.note-color').onclick = ()=>selectNote(id);
    item.onclick = (e)=>{ if(e.target.closest('.note-del,.note-move')) return; selectNote(id); };
    item.querySelector('.note-del').onclick = (e)=>{ e.stopPropagation(); deleteNote(id); };
    item.querySelector('.up').onclick = (e)=>{ e.stopPropagation(); moveNote(id, -1); };
    item.querySelector('.down').onclick = (e)=>{ e.stopPropagation(); moveNote(id, 1); };
    if(idx === 0) item.querySelector('.up').classList.add('disabled');
    if(idx === ids.length-1) item.querySelector('.down').classList.add('disabled');
    list.appendChild(item);
  });
}

function moveNote(id, dir){
  const ids = Object.keys(notes).sort((a,b)=> (notes[a].order||0) - (notes[b].order||0));
  const idx = ids.indexOf(id);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= ids.length) return;
  const otherId = ids[swapIdx];
  const tmp = notes[id].order;
  notes[id].order = notes[otherId].order;
  notes[otherId].order = tmp;
  renderNoteList();
  notesCol.doc(id).set(notes[id]).catch(console.error);
  notesCol.doc(otherId).set(notes[otherId]).catch(console.error);
}

function selectNote(id){
  currentNoteId = id;
  const n = notes[id];
  document.getElementById('noteTitle').value = n.title || '';
  document.getElementById('noteBody').innerHTML = n.html || '';
  renderAttachments();
  renderSwatches(n.color);
  renderNoteList();
  // on repasse en mode lecture à chaque changement d'onglet
  document.getElementById('styleMenu').classList.remove('open');
  document.getElementById('noteBody').setAttribute('contenteditable','false');
  document.getElementById('noteBody').classList.add('read-only');
  document.getElementById('penBtn').classList.remove('active');
}

function renderAttachments(){
  const box = document.getElementById('attachList');
  box.innerHTML = '';
  const n = notes[currentNoteId];
  if(!n || !n.attachments) return;
  n.attachments.forEach((att,i)=>{
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    const isImg = /\.(png|jpe?g|gif|webp)$/i.test(att.name);
    chip.innerHTML = `${isImg ? `<img src="${att.data}">` : '📄'}<a href="${att.data}" download="${att.name}">${att.name}</a><span class="rm">✕</span>`;
    chip.querySelector('.rm').onclick = ()=>{
      n.attachments.splice(i,1);
      renderAttachments();
      scheduleSave();
    };
    box.appendChild(chip);
  });
}

async function createNote(title){
  const id = uid();
  notes[id] = { title: title || 'Nouvel onglet', html:'', color: TAB_COLORS[Object.keys(notes).length % TAB_COLORS.length], attachments:[], order: Date.now() };
  currentNoteId = id;
  renderNoteList();
  try{
    await notesCol.doc(id).set(notes[id]);
  }catch(e){ console.error(e); toast('Impossible de créer l\'onglet (vérifie les règles Firestore)'); }
  return id;
}
document.getElementById('addNoteBtn').onclick = async ()=>{
  const id = await createNote();
  selectNote(id);
};

/* Si l'utilisateur tape sans avoir sélectionné d'onglet, on en crée un automatiquement */
async function ensureCurrentNote(){
  if(currentNoteId && notes[currentNoteId]) return currentNoteId;
  return await createNote();
}

async function deleteNote(id){
  if(!confirm('Supprimer cet onglet définitivement ?')) return;
  delete notes[id];
  await notesCol.doc(id).delete();
  if(currentNoteId === id){
    const rest = Object.keys(notes);
    if(rest.length) selectNote(rest[0]);
    else { currentNoteId=null; document.getElementById('noteTitle').value=''; document.getElementById('noteBody').innerHTML=''; renderAttachments(); }
  }
  renderNoteList();
}

function scheduleSave(id){
  const targetId = id || currentNoteId;
  if(!targetId) return;
  document.getElementById('saveDot').classList.add('saving');
  document.getElementById('saveText').textContent = 'Enregistrement…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(!notes[targetId]) return;
      await notesCol.doc(targetId).set(notes[targetId]);
      document.getElementById('saveDot').classList.remove('saving');
      document.getElementById('saveText').textContent = 'Enregistré';
    }catch(e){
      document.getElementById('saveDot').classList.remove('saving');
      document.getElementById('saveText').textContent = 'Erreur de sauvegarde';
      toast('Sauvegarde impossible — vérifie les règles Firestore');
      console.error(e);
    }
  }, 500);
}

document.getElementById('noteTitle').addEventListener('input', async e=>{
  const id = await ensureCurrentNote();
  notes[id].title = e.target.value;
  renderNoteList();
  scheduleSave(id);
});
document.getElementById('noteBody').addEventListener('input', async e=>{
  const id = await ensureCurrentNote();
  notes[id].html = e.target.innerHTML;
  scheduleSave(id);
});

document.getElementById('penBtn').onclick = ()=>{
  const menu = document.getElementById('styleMenu');
  const body = document.getElementById('noteBody');
  const editing = !menu.classList.contains('open');
  menu.classList.toggle('open', editing);
  body.setAttribute('contenteditable', editing ? 'true' : 'false');
  body.classList.toggle('read-only', !editing);
  document.getElementById('penBtn').classList.toggle('active', editing);
  if(editing) body.focus();
};

/* Garder la sélection de texte active même quand on clique sur un contrôle du menu
   (sinon la sélection est perdue et les couleurs/formats ne s'appliquent nulle part) */
let savedRange = null;
const noteBodyEl = document.getElementById('noteBody');
function saveSelection(){
  const sel = window.getSelection();
  if(sel && sel.rangeCount > 0 && noteBodyEl.contains(sel.anchorNode)){
    savedRange = sel.getRangeAt(0).cloneRange();
  }
}
function restoreSelection(){
  noteBodyEl.focus();
  if(savedRange){
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
}
noteBodyEl.addEventListener('mouseup', saveSelection);
noteBodyEl.addEventListener('keyup', saveSelection);
noteBodyEl.addEventListener('touchend', saveSelection);
document.getElementById('styleMenu').addEventListener('mousedown', e=>{
  // empêche le contenteditable de perdre le focus/la sélection au clic sur un bouton/menu
  if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') e.preventDefault();
});

document.querySelectorAll('.fmt-btn[data-cmd]').forEach(btn=>{
  btn.onclick = ()=>{
    restoreSelection();
    document.execCommand(btn.dataset.cmd, false, null);
    document.getElementById('noteBody').dispatchEvent(new Event('input'));
    saveSelection();
  };
});
document.getElementById('fontFamily').onchange = (e)=>{
  restoreSelection();
  document.execCommand('fontName', false, e.target.value);
  document.getElementById('noteBody').dispatchEvent(new Event('input'));
  saveSelection();
};
document.getElementById('fontSize').onchange = (e)=>{
  restoreSelection();
  document.execCommand('fontSize', false, e.target.value);
  document.getElementById('noteBody').dispatchEvent(new Event('input'));
  saveSelection();
};
document.getElementById('fontColor').oninput = (e)=>{
  restoreSelection();
  document.execCommand('foreColor', false, e.target.value);
  document.getElementById('noteBody').dispatchEvent(new Event('input'));
  saveSelection();
};
document.getElementById('bgColor').oninput = (e)=>{
  restoreSelection();
  document.execCommand('hiliteColor', false, e.target.value);
  document.getElementById('noteBody').dispatchEvent(new Event('input'));
  saveSelection();
};

document.getElementById('fileInput').addEventListener('change', async (e)=>{
  await ensureCurrentNote();
  const files = Array.from(e.target.files);
  for(const f of files){
    if(f.size > 900000){ toast(`"${f.name}" trop lourd (max ~900 Ko)`); continue; }
    const data = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.onerror = rej;
      r.readAsDataURL(f);
    });
    if(!notes[currentNoteId].attachments) notes[currentNoteId].attachments = [];
    notes[currentNoteId].attachments.push({ name: f.name, data });
  }
  renderAttachments();
  scheduleSave();
  e.target.value = '';
});

let firstNotesSnapshot = true;
function listenNotes(){
  notesCol.orderBy('order','asc').onSnapshot(async snap=>{
    let changedRemote = false;
    snap.docChanges().forEach(ch=>{
      if(ch.type === 'removed'){ delete notes[ch.doc.id]; changedRemote = true; }
      else {
        notes[ch.doc.id] = ch.doc.data();
        changedRemote = true;
      }
    });
    if(firstNotesSnapshot){
      firstNotesSnapshot = false;
      if(Object.keys(notes).length === 0){
        const id = await createNote('Mon premier onglet');
        selectNote(id);
        return;
      }
    }
    if(changedRemote){
      renderNoteList();
      if(!currentNoteId && Object.keys(notes).length) selectNote(Object.keys(notes)[0]);
      if(currentNoteId && !notes[currentNoteId]){
        const rest = Object.keys(notes);
        if(rest.length) selectNote(rest[0]);
      }
    }
  }, err=>{ console.error(err); toast('Connexion Firebase impossible — vérifie les règles Firestore'); });
}
listenNotes();

/* ================================================================
   COMMUNICATION — FORUM
   ================================================================ */
const msgsCol = db.collection('forum_messages');
let replyTarget = null;
const AVATAR_COLORS = ['#0a84ff','#bf5af2','#ff375f','#30d158','#ff9f0a','#64d2ff'];
function colorFor(name){
  let h=0; for(const c of name) h = c.charCodeAt(0)+((h<<5)-h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }
function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = (Date.now() - d.getTime())/1000;
  if(diff < 60) return 'à l\'instant';
  if(diff < 3600) return Math.floor(diff/60)+' min';
  if(diff < 86400) return Math.floor(diff/3600)+' h';
  return d.toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderForum(){
  const feed = document.getElementById('forumFeed');
  const wasNearBottom = (feed.scrollHeight - feed.scrollTop - feed.clientHeight) < 80;
  feed.innerHTML = '';
  if(allMessages.length === 0){
    feed.innerHTML = '<div class="empty-state">Aucun message pour l\'instant. Sois le premier à écrire ! 🎉</div>';
    return;
  }
  const roots = allMessages.filter(m=>!m.replyTo).sort((a,b)=> (a.createdAtMs||0) - (b.createdAtMs||0));
  roots.forEach(m=>{
    feed.appendChild(buildMsgEl(m, false));
    const replies = allMessages.filter(r=>r.replyTo === m.id).sort((a,b)=>(a.createdAtMs||0)-(b.createdAtMs||0));
    replies.forEach(r=>{
      const wrap = document.createElement('div');
      wrap.className = 'thread-reply';
      wrap.appendChild(buildMsgEl(r, true));
      feed.lastChild.appendChild(wrap);
    });
  });
  if(wasNearBottom) feed.scrollTop = feed.scrollHeight;
}

function buildMsgEl(m, isReply){
  const div = document.createElement('div');
  div.className = 'msg glass';
  if(isReply) div.style.background = 'transparent', div.style.border='none', div.style.padding='0', div.style.backdropFilter='none';
  const col = colorFor(m.name);
  div.innerHTML = `
    <div class="msg-head">
      <div class="avatar" style="background:${col}">${initials(m.name)}</div>
      <div class="msg-name">${escapeHtml(m.name)}</div>
      <div class="msg-time">${timeAgo(m.createdAt)}${m.edited ? '<span class="msg-edited">(modifié)</span>' : ''}</div>
    </div>
    <div class="msg-text" id="text-${m.id}">${escapeHtml(m.text)}</div>
    <div class="msg-actions">
      <span class="act-reply">Répondre</span>
      <span class="act-edit">Modifier</span>
      <span class="act-del">Supprimer</span>
    </div>`;
  div.querySelector('.act-reply').onclick = ()=>{
    replyTarget = m;
    document.getElementById('replyBanner').classList.add('show');
    document.getElementById('replyToName').textContent = m.name;
    document.getElementById('replyToPreview').textContent = m.text.slice(0,40);
    document.getElementById('forumMsg').focus();
  };
  div.querySelector('.act-del').onclick = async ()=>{
    if(confirm('Supprimer ce message ?')) await msgsCol.doc(m.id).delete();
  };
  div.querySelector('.act-edit').onclick = ()=>{
    const textEl = div.querySelector('.msg-text');
    const original = m.text;
    textEl.innerHTML = `<textarea class="edit-area" rows="3">${escapeHtml(original)}</textarea>
      <div class="edit-actions"><button class="edit-save">Enregistrer</button><button class="edit-cancel">Annuler</button></div>`;
    textEl.querySelector('.edit-cancel').onclick = ()=>{ textEl.textContent = original; };
    textEl.querySelector('.edit-save').onclick = async ()=>{
      const val = textEl.querySelector('textarea').value.trim();
      if(val) await msgsCol.doc(m.id).update({ text: val, edited: true });
    };
  };
  return div;
}

let allMessages = [];
msgsCol.orderBy('createdAt','asc').onSnapshot(snap=>{
  allMessages = snap.docs.map(d=>{
    const data = d.data();
    return { id:d.id, ...data, createdAtMs: data.createdAt ? (data.createdAt.toMillis ? data.createdAt.toMillis() : 0) : 0 };
  });
  renderForum();
}, err=>{ console.error(err); toast('Connexion Firebase impossible'); });

document.getElementById('cancelReply').onclick = ()=>{
  replyTarget = null;
  document.getElementById('replyBanner').classList.remove('show');
};

async function sendForumMessage(){
  const nameEl = document.getElementById('forumName');
  const msgEl = document.getElementById('forumMsg');
  const name = nameEl.value.trim();
  const text = msgEl.value.trim();
  if(!name){ toast('Entre ton nom'); nameEl.focus(); return; }
  if(!text) return;
  await msgsCol.add({
    name, text,
    replyTo: replyTarget ? replyTarget.id : null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    edited: false
  });
  msgEl.value = '';
  msgEl.style.height = 'auto';
  replyTarget = null;
  document.getElementById('replyBanner').classList.remove('show');
  localStorage.setItem('daily_forum_name', name);
  setTimeout(()=>{ const f=document.getElementById('forumFeed'); f.scrollTop = f.scrollHeight; }, 60);
}
document.getElementById('forumSend').onclick = sendForumMessage;
document.getElementById('forumMsg').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendForumMessage(); }
});
document.getElementById('forumMsg').addEventListener('input', function(){
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight,140)+'px';
});
const savedName = localStorage.getItem('daily_forum_name');
if(savedName) document.getElementById('forumName').value = savedName;

/* ================================================================
   ASSISTANT — IA (Cloudflare Worker)
   ================================================================ */
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
let chatHistory = [];

function addBubble(text, who){
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.textContent = text;
  chatMessages.appendChild(b);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return b;
}
function addTyping(){
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typingIndicator';
  t.innerHTML = '<span></span><span></span><span></span>';
  chatMessages.appendChild(t);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
function removeTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

async function sendChat(){
  const text = chatInput.value.trim();
  if(!text) return;
  addBubble(text, 'user');
  chatHistory.push({ role:'user', content:text });
  chatInput.value = ''; chatInput.style.height='auto';
  addTyping();
  try{
    const res = await fetch(AI_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ messages: chatHistory, message: text, prompt: text })
    });
    const raw = await res.text();
    if(!res.ok){
      throw new Error(`Le serveur a répondu ${res.status} : ${raw.slice(0,200) || 'pas de détail'}`);
    }
    let reply = raw;
    try{
      const data = JSON.parse(raw);
      reply = data.reply ?? data.response ?? data.text ?? data.content ?? data.result ?? data.message
        ?? data.output ?? data?.choices?.[0]?.message?.content ?? data?.choices?.[0]?.text
        ?? (typeof data === 'string' ? data : null);
      if(reply == null) reply = JSON.stringify(data);
    }catch(_){ /* la réponse n'est pas du JSON, on garde le texte brut */ }
    removeTyping();
    addBubble(String(reply), 'ai');
    chatHistory.push({ role:'assistant', content: String(reply) });
  }catch(err){
    removeTyping();
    let msg = err.message;
    if(msg === 'Failed to fetch'){
      msg = "impossible d'atteindre le serveur (URL du Worker incorrecte, Worker arrêté, ou CORS non configuré côté Cloudflare — vérifie les en-têtes Access-Control-Allow-Origin).";
    }
    addBubble("Erreur en contactant l'assistant : " + msg, 'ai');
    toast('Assistant IA injoignable — voir le message ci-dessus');
    console.error(err);
  }
}
document.getElementById('chatSend').onclick = sendChat;
chatInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});
chatInput.addEventListener('input', function(){
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight,120)+'px';
});
</script>
